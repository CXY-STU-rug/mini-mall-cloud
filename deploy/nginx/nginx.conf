# ============================================================
# Nginx 反向代理配置
# 职责：① 托管前端 SPA 静态资源  ② /api 转发给网关容器  ③ HTTPS 终结
# 挂载到容器 /etc/nginx/conf.d/default.conf
# ============================================================

server {
    listen 80;                          # 先用 80 跑通；证书配好后改走 443
    server_name _;                      # 域名，暂用 _ 通配；上线填真实域名

    # ── 前端 SPA(C 端)静态资源 ──
    location / {
        root /usr/share/nginx/html;     # 前端 dist 拷进这里
        index index.html;
        try_files $uri $uri/ /index.html;  # ★history 路由模式必备：找不到文件回退到 index.html
    }

    # ── 接口统一转发给网关 ──
    # 前端 baseURL 是 /api，本机走 Vite 代理，上线换成这里转发到 gateway 容器
    location /api/ {
        proxy_pass http://gateway:9080/;   # 用容器名 gateway，末尾 / 会剥掉 /api 前缀
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;          # 透传真实客户端 IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 支付宝异步回调直达网关(不走 /api 前缀，支付宝按 notify-url 原样打) ──
    # 上线后支付宝后台的 notify-url 填 http(s)://你的域名/pay/notify
    location ~ ^/(pay|refund)/notify$ {
        proxy_pass http://gateway:9080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}


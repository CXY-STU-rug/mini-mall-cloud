# ═══════════════════════════════════════════════════════════
# bootstrap.yml — Spring Cloud 启动期最早读的配置
# mini-mall-ai 服务 (比 application.yml 更早加载, 服务名/配置中心地址放这)
# ═══════════════════════════════════════════════════════════
spring:
  application:
    name: mini-mall-ai

  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
        group: DEFAULT_GROUP
        namespace: public
